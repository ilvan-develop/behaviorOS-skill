name: OAGE Governance CI

# behaviorOS's own CI. It is deliberately stricter than the workflow behaviorOS installs into
# consumer projects (templates/base/ci/oage-ci.yml), because here the governance kernel itself
# is the product: the question is not "does the code run?" but "can an agent trying to break
# the governance system break it?".

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  policy:
    name: Governance policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Policy validation
        run: node scripts/validate.mjs

      # validate.mjs only proves a policy is well-formed. The doctor proves someone applies it:
      # it blocks on a policy declared "enforced" that nothing reads, on a declared consumer
      # that no longer references its policy, and on a runtime claim no plugin backs.
      - name: Governance contract
        run: node scripts/governance-doctor.mjs

      - name: Secret scan
        run: node scripts/lint.mjs --secrets-only

      - name: Critical anti-pattern scan
        run: node scripts/lint.mjs --anti-patterns-only

      # The declared gate (ci-gate.json) must match the pipeline: ci-gate-check.mjs fails the
      # job when a required check has no step, so the declaration cannot drift from reality.
      - name: CI gate declaration check
        run: node scripts/ci-gate-check.mjs

  invariants:
    name: Kernel invariants (adversarial)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # KERNEL_SELF_PROTECTION. Drives the real tool.execute.before hook and asserts that
      # writing governance, editing the enforcer, deleting a policy, overwriting the audit
      # config, and shell bypasses (heredoc, rm, mv, sed -i, git checkout) are all DENIED —
      # in every path spelling, since an absolute-vs-relative mismatch is exactly what made
      # the gate dead code while the suite stayed green.
      - name: Kernel self-protection must hold
        run: node --test "tests/kernel-self-protection.test.js"

      # Loop governance, tested from both sides. Over-blocking legitimate work is itself the
      # vulnerability — it is what drove a model to a heredoc bypass instead of escalating —
      # so the false-positive half of this file is as load-bearing as the attack half.
      - name: Loop governance ladder must hold
        run: node --test "tests/loop-governance.test.js"

      - name: Full suite
        run: npm test

  packaging:
    name: Packaging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # A consumer must be able to install the package. Regression fence for the `install`
      # lifecycle-script trap, where `npm install behaviorOS` aborted because npm runs a
      # script named "install" automatically and it exited 1.
      - name: Consumer install of the packed tarball
        run: |
          set -euo pipefail
          npm pack --pack-destination /tmp
          mkdir -p /tmp/consumer && cd /tmp/consumer
          echo '{"name":"consumer","version":"1.0.0","private":true}' > package.json
          npm install /tmp/behaviorOS-*.tgz --no-audit --no-fund

      # A clean clone must contain everything the kernel needs — the audit found the entire
      # .opencode/plugins/ tree unversioned while the system depended on it.
      - name: Kernel is fully versioned
        run: |
          set -euo pipefail
          for f in \
            .opencode/plugins/oage-enforce.js \
            .opencode/plugins/oage-audit.js \
            .opencode/plugins/lib/oage-lib.js \
            .opencode/governance/protected-resources.json \
            templates/base/ci/oage-ci.yml \
            scripts/ci-run.mjs \
            scripts/ci-gate-check.mjs
          do
            test -f "$f" || { echo "::error::missing from a clean checkout: $f"; exit 1; }
          done
          echo "kernel present in a clean checkout"

  final-gate:
    name: Final gate
    runs-on: ubuntu-latest
    needs: [policy, invariants, packaging]
    if: always()
    steps:
      - name: Verdict
        run: |
          set -euo pipefail
          echo "policy:     ${{ needs.policy.result }}"
          echo "invariants: ${{ needs.invariants.result }}"
          echo "packaging:  ${{ needs.packaging.result }}"
          if [ "${{ needs.policy.result }}" != "success" ] \
            || [ "${{ needs.invariants.result }}" != "success" ] \
            || [ "${{ needs.packaging.result }}" != "success" ]; then
            echo "::error::OAGE final gate FAILED."
            exit 1
          fi
          echo "OAGE final gate PASSED."
