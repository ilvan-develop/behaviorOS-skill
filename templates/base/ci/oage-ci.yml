name: OAGE Governance CI

# CI is the final authority (OAGE §34-36, §60): it re-checks policy and quality independently
# of what an agent claims to have done. Every step below is fail-closed — a step that cannot
# fail cannot be an authority, so "skip" is decided by inspecting package.json (scripts/ci-run.mjs),
# never by swallowing an exit code.

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  governance:
    name: Governance policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: |
          set -euo pipefail
          if [ -f pnpm-lock.yaml ]; then
            corepack enable && pnpm install --frozen-lockfile
          elif [ -f yarn.lock ]; then
            corepack enable && yarn install --immutable
          elif [ -f package-lock.json ]; then
            npm ci
          else
            echo "No lockfile found — skipping dependency install"
          fi

      - name: Policy validation
        run: node scripts/validate.mjs

      # Verifies the Governance Contract: every policy in this project declares who has the
      # authority to apply it, and every declared consumer still reads it.
      - name: Governance contract
        run: node scripts/governance-doctor.mjs

      - name: Secret scan
        run: node scripts/lint.mjs --secrets-only

      - name: Critical anti-pattern scan
        run: node scripts/lint.mjs --anti-patterns-only

      # The declared gate (ci-gate.json) must match the pipeline: ci-gate-check.mjs fails the
      # job when a required check has no step, so the declaration cannot drift from reality.
      - name: CI gate declaration check
        run: node scripts/ci-gate-check.mjs

  quality:
    name: Quality gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install dependencies
        run: |
          set -euo pipefail
          if [ -f pnpm-lock.yaml ]; then
            corepack enable && pnpm install --frozen-lockfile
          elif [ -f yarn.lock ]; then
            corepack enable && yarn install --immutable
          elif [ -f package-lock.json ]; then
            npm ci
          else
            echo "No lockfile found — skipping dependency install"
          fi

      # Each step exits non-zero when the script exists and fails, and 0 only when the script
      # is genuinely absent. See scripts/ci-run.mjs for why `|| echo skipping` is not usable.
      - name: Lint
        run: node scripts/ci-run.mjs lint

      - name: Typecheck
        run: node scripts/ci-run.mjs typecheck

      - name: Tests
        run: node scripts/ci-run.mjs test

      - name: Build
        run: node scripts/ci-run.mjs build

  final-gate:
    name: Final gate
    runs-on: ubuntu-latest
    needs: [governance, quality]
    # Runs whatever happened upstream so the aggregate verdict is explicit in the log rather
    # than inferred from which jobs are missing.
    if: always()
    steps:
      - name: Verdict
        run: |
          set -euo pipefail
          echo "governance: ${{ needs.governance.result }}"
          echo "quality:    ${{ needs.quality.result }}"
          if [ "${{ needs.governance.result }}" != "success" ] || [ "${{ needs.quality.result }}" != "success" ]; then
            echo "::error::OAGE final gate FAILED — a governance or quality gate did not pass."
            exit 1
          fi
          echo "OAGE final gate PASSED."
